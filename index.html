<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web 游戏合集</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1d1d1f;
      background: #f5f5f7;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 20px;
    }

    h1 {
      margin: 0 0 32px;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 4px;
      text-align: center;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 22px;
      background: #fff;
      border: 1px solid #e5e5ea;
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 32px -18px rgba(0, 0, 0, 0.3);
    }

    .game-icon {
      font-size: 34px;
    }

    .game-name {
      font-size: 18px;
      font-weight: 600;
    }

    .game-desc {
      font-size: 13px;
      color: #86868b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Web 游戏合集</h1>
    <div class="games">
      <a class="game-card" href="minesweeper/">
        <span class="game-icon">💣</span>
        <span class="game-name">扫雷</span>
        <span class="game-desc">经典扫雷，每局随机布雷，支持三档难度和自定义尺寸。</span>
      </a>
    </div>
  </main>
</body>
</html>
